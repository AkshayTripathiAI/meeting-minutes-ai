[project]
name = "meeting-minutes-ai"
version = "0.2.0"
description = "Turn a meeting recording into a timestamped transcript and structured minutes (decisions, action items, open questions)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["faster-whisper>=1.2.1", "av>=14,<15", "openai>=1.40", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
minutes = "minutes.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["minutes"]
