name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Tests use a fake LLM and never load Whisper, so only the light dependencies are needed.
      - run: pip install pydantic openai pytest
      - run: pytest -q
